{% set version = "1.3.2" %}

package:
  name: cython-blis
  version: {{ version }}

source:
  - url: https://github.com/explosion/cython-blis/archive/refs/tags/release-v{{ version }}.tar.gz
    sha256: fa9b597ebbd76d39d81729f6676a7efbc61ef53467b09d931c06e5d753c3bbb3
    patches:
      - patches/0001-backport-clang-checks-from-upstream-configure.patch
      # backport (morally speaking) https://github.com/flame/blis/pull/908
      - patches/0002-Blacklist-knl-for-clang-19.patch
  - folder: flame-blis
    git_url: https://github.com/honnibal/blis
    git_rev: e81f7291c52c04c4bdbee0aba3e39d703454eab5

build:
  number: 0
  # if you care about ppc, please debug the failures
  skip: true  # [ppc64le]

requirements:
  build:
    - python                                 # [build_platform != target_platform]
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
    - cython                                 # [build_platform != target_platform]
    - numpy                                  # [build_platform != target_platform]
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
    - clangdev  # [win]
  host:
    - python
    - pip
    - cython
    - setuptools
    - numpy
    - wheel
  run:
    - python

test:
  requires:
    - pytest
    - hypothesis
  imports:
    - blis
    - blis.py
    - blis.cy
  commands:
    - pytest --tb=native --pyargs blis

about:
  home: http://github.com/explosion/cython-blis
  license: BSD-3-Clause
  license_family: BSD
  license_file:
    - LICENSE
    - blis/LICENSE
  summary: Fast matrix-multiplication as a self-contained Python library – no system dependencies!

  doc_url: https://github.com/explosion/cython-blis
  dev_url: https://github.com/explosion/cython-blis

extra:
  recipe-maintainers:
    - conda-forge/spacy
